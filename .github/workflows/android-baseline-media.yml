name: Ric Browser Baseline Media Build

on:
  push:
    branches: [ ric-power-c112167 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Restore baseline media external routing
        run: python3 .github/scripts/patch-media-baseline.py

      - name: Build installable debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ric-browser-baseline-media-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
