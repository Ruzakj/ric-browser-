name: Android Build & Runtime QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Clean, test and build debug/release
        run: |
          set -euo pipefail
          gradle --no-daemon clean test :app:assembleDebug :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -size +0c | grep -q .

      - name: APK static validation
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.ruzakj.ricbrowser'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "launchable-activity: name='com.ruzakj.ricbrowser.MainActivity'" "$RUNNER_TEMP/apk-badging.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/runtime-smoke.sh

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' | head -n 1)
          test -n "${UNSIGNED_APK:-}"

          SIGNED_APK="app/build/outputs/apk/release/ric-browser-release-signed.apk"
          KEYSTORE="$RUNNER_TEMP/ric-browser-release.keystore"
          ALIAS="ricbrowser"
          PASS="ricbrowser-release"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ric Browser, OU=Ric Browser, O=Ruzakj, L=Indonesia, C=ID"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          test -s "$SIGNED_APK"

      - name: Upload QA-passed signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ric-browser-release-signed-qa-passed
          path: app/build/outputs/apk/release/ric-browser-release-signed.apk
          if-no-files-found: error
