name: Fix ads and RIC Player routing

on:
  push:
    paths:
      - '.github/scripts/fix_browser_ads_player.py'
      - '.github/workflows/fix-ads-ric-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply browser patch
        run: python3 .github/scripts/fix_browser_ads_player.py

      - name: Commit source update
        run: |
          git config user.name "Ruzakj"
          git config user.email "93422529+Ruzakj@users.noreply.github.com"
          git add app/src/main/java/com/ruzakj/ricbrowser/MainActivity.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Block bm-88 ads and redirects"
          git push origin main
